<style>
/* Layout: one centered column on white. Wordmark, pearl speech bubble (tail points down), the manager behind her desk with floating service icons, controls, then the work section with phone-framed videos grouped by category.
   A single bright, white look on purpose; every color is set explicitly so it reads the same on any host background. */
:root {
  --paper: #ffffff;
  --pearl: #f2f3f9;
  --pearl-2: #e6e9f3;
  --line: #dcdfec;
  --ink: #1d2236;
  --muted: #5d6279;
  --gold: #c9a24a;
  --gold-soft: #f4e6bd;
  --font-display: "Readex Pro", "Tajawal", system-ui, sans-serif;
  --font-body: "Tajawal", "Readex Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-brand: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--paper);
  background-image: radial-gradient(70% 34% at 50% 0%, #f4f5fb 0%, rgba(255, 255, 255, 0) 100%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 20px 72px;
  padding-inline: 16px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 14px; }

.mark { display: flex; align-items: baseline; justify-content: flex-end; gap: 12px; font-family: var(--font-brand); color: var(--ink); }
.mark b { font-weight: 600; font-size: 28px; letter-spacing: .2em; }
.mark span { font-family: var(--font-body); font-weight: 700; font-size: 11px; letter-spacing: .32em; color: var(--muted); }
.mark svg { width: 18px; height: 18px; align-self: center; flex: none; }

.bubble {
  position: relative; background: var(--pearl); border: 1px solid var(--line);
  border-radius: 30px; padding: 22px 26px 20px; min-width: 0;
  box-shadow: 0 16px 40px rgba(29, 34, 54, .08);
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; width: 24px; height: 24px;
  background: var(--pearl); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  transform: translateX(-50%) rotate(45deg); border-radius: 0 0 6px 0;
}
.speaker { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 700; font-size: 11px; letter-spacing: .24em; color: var(--muted); }
.speaker i { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); opacity: .4; }
.speaking .speaker i { opacity: 1; animation: beat .6s ease-in-out infinite alternate; }
.lines { display: grid; }
.line {
  grid-area: 1 / 1; margin: 0; visibility: hidden;
  font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 4.8vw, 32px);
  line-height: 1.65; text-wrap: balance; overflow-wrap: anywhere;
}
.line.on { visibility: visible; }
.w { display: inline; border-radius: 6px; padding-inline: 2px; opacity: .28; transition: opacity .25s ease; }
.w.said { opacity: 1; }
.w.now { opacity: 1; background: linear-gradient(transparent 60%, var(--gold-soft) 60%, var(--gold-soft) 94%, transparent 94%); }

.stage { position: relative; width: 100%; max-width: 520px; margin: 6px auto 0; display: flex; justify-content: center; }
.stage::before {
  content: ""; position: absolute; left: 50%; top: 2%; width: min(340px, 80vw); aspect-ratio: 1; transform: translateX(-50%);
  border-radius: 50%; background: radial-gradient(circle at 50% 30%, #ffffff 0%, var(--pearl) 60%, var(--pearl-2) 100%);
}
.char { position: relative; width: min(290px, 70vw); height: auto; display: block; overflow: visible; }
.bob { animation: bob 4.4s ease-in-out infinite; }
.cheer .bob { animation: hop .7s ease-in-out 3; }
.eyes { transform-origin: 130px 98px; animation: blink 5s infinite; }
.char .open { display: none; transform-origin: 130px 121px; }
.char.talk .open { display: block; }
.char.talk .smile { display: none; }
.arm { transform-origin: 0 0; }
.talk .arm.r { animation: waveR .9s ease-in-out infinite alternate; }
.twinkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.twinkle:nth-of-type(2) { animation-delay: .8s; }
.twinkle:nth-of-type(3) { animation-delay: 1.6s; }

.chip {
  position: absolute; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px;
  opacity: 0; transform: scale(.4) translateY(14px); pointer-events: none;
  transition: opacity .35s ease, transform .5s cubic-bezier(.3, 1.6, .5, 1);
}
.chip.on { opacity: 1; transform: none; }
.chip .ic { width: clamp(48px, 12vw, 64px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); color: var(--ink); box-shadow: 0 10px 24px rgba(29, 34, 54, .12); }
.chip .ic svg { width: 50%; height: 50%; }
.chip span { font-weight: 700; font-size: 14px; color: var(--muted); }
.p0 { left: 0; top: 4%; } .p1 { right: 0; top: 4%; } .p2 { left: 0; top: 44%; } .p3 { right: 0; top: 44%; }

.sparks { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 3; }
.sparks i { position: absolute; left: 50%; top: 40%; width: 14px; height: 14px; animation: spark 1.2s ease-out forwards; }
.sparks svg { width: 100%; height: 100%; display: block; }

.controls { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.btn {
  border: 0; border-radius: 999px; padding: 13px 32px; background: var(--ink); color: #fff;
  font-family: var(--font-display); font-weight: 600; font-size: 18px; box-shadow: 0 10px 24px rgba(29, 34, 54, .22);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(29, 34, 54, .26); }
.btn:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(29, 34, 54, .2); }
.btn.cta { background: var(--gold); color: var(--ink); box-shadow: 0 10px 24px rgba(201, 162, 74, .38); }
.pill { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 14px; }
.pill:hover:not(:disabled) { background: var(--pearl); }
.pill:disabled { opacity: .55; cursor: default; }
.dots { display: flex; gap: 7px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--pearl-2); transition: background .3s ease, transform .3s ease; }
.dots i.done { background: var(--ink); }
.dots i.now { background: var(--gold); transform: scale(1.35); }

.work { display: flex; flex-direction: column; gap: 34px; padding-top: 12px; border-top: 1px solid var(--line); }
.work h2 { margin: 18px 0 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; }
.cat { display: flex; flex-direction: column; gap: 16px; }
.cat h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 22px; }
.cat h3 em { font-style: normal; font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--muted); background: var(--pearl); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; }
.cards { display: flex; flex-wrap: wrap; gap: 26px 22px; justify-content: flex-start; }
.card { margin: 0; display: flex; flex-direction: column; gap: 12px; width: clamp(168px, 44vw, 232px); min-width: 0; }
.phone { position: relative; aspect-ratio: 464 / 848; border: 6px solid var(--ink); border-radius: 30px; overflow: hidden; background: #000; box-shadow: 0 18px 40px rgba(29, 34, 54, .2); }
.phone video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card figcaption b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.3; }
.card figcaption span { color: var(--muted); font-size: 15px; }

@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes hop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.08) } }
@keyframes waveR { from { transform: rotate(-88deg) } to { transform: rotate(-128deg) } }
@keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }
@keyframes beat { from { transform: scale(.8) } to { transform: scale(1.3) } }
@keyframes spark { 0% { transform: translate(0, 0) scale(.3) rotate(0); opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .sparks { display: none; }
}
</style>

<script>

(function () {
  "use strict";
  var LINES = [
    "نصمم لكِ تجربة رقمية متكاملة",
    "تجمع بين جمال التصميم، سهولة الاستخدام، والتفاعل؛",
    "بدءًا من الدعوات الإلكترونية، وصولًا إلى المواقع والتجارب والألعاب التفاعلية.",
    "نحوّل فكرتك إلى تجربة تُرى، تُعاش، وتُتذكّر",
    "والآن، لنرى نبذة من الشغل."
  ];
  var KEYS = { "الدعوات": 0, "المواقع": 1, "التجارب": 2, "والتجارب": 2, "الألعاب": 3, "والألعاب": 3 };
  var KEY_LINE = 2, SPARK_LINE = 3;
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var model = LINES.map(function (text) {
    var words = [], re = /\S+/g, m;
    while ((m = re.exec(text))) words.push({ t: m[0], s: m.index });
    return { text: text, words: words };
  });
  $("lines").innerHTML = model.map(function (l, i) {
    return '<p class="line' + (i === 0 ? " on" : "") + '">' + l.words.map(function (w) { return '<span class="w">' + w.t + "</span>"; }).join(" ") + "</p>";
  }).join("");
  $("dots").innerHTML = model.map(function () { return "<i></i>"; }).join("");

  var lineEls = $("lines").children, dotEls = $("dots").children, chips = [0, 1, 2, 3].map(function (n) { return $("chip" + n); });
  var charEl = $("char"), mouth = $("mouth"), stage = $("stage"), bubble = $("bubble");
  var playBtn = $("play"), voiceBtn = $("voice"), cta = $("cta");

  var run = 0, timers = [], mouthTimer = null, voiceOn = true, cur = null, idxNow = -1;
  var ttsOK = "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance !== "undefined";
  if (!ttsOK) { voiceBtn.disabled = true; voiceBtn.textContent = "الصوت غير متاح"; voiceBtn.setAttribute("aria-pressed", "false"); }

  var noVoice = false;
  function updateVoiceBtn() {
    if (!ttsOK) return;
    voiceBtn.textContent = !voiceOn ? "الصوت متوقف" : noVoice ? "لا يوجد صوت عربي على جهازك" : "الصوت مفعّل";
    voiceBtn.setAttribute("aria-pressed", String(voiceOn && !noVoice));
  }
  function setVoiceNote(f) { noVoice = f; updateVoiceBtn(); }
  function later(fn, ms, id) { timers.push(setTimeout(function () { if (id === run) fn(); }, ms)); }
  function norm(w) { return w.replace(/[^\u0621-\u064A]/g, ""); }

  function pickVoice() {
    if (!ttsOK) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    var ar = vs.filter(function (v) { return /^ar/i.test(v.lang); });
    var pref = ar.filter(function (v) { return /zariyah|hoda|salma|laila|female|google/i.test(v.name); });
    return pref[0] || ar[0] || null;
  }
  if (ttsOK && window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", pickVoice);

  function startMouth() {
    charEl.classList.add("talk"); bubble.classList.add("speaking");
    if (mouthTimer) return;
    mouthTimer = setInterval(function () { mouth.style.transform = "scaleY(" + (0.25 + Math.random() * 0.85).toFixed(2) + ")"; }, 120);
  }
  function stopMouth() {
    if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
    charEl.classList.remove("talk"); bubble.classList.remove("speaking");
    mouth.style.transform = "";
  }
  function clearAll() {
    timers.forEach(clearTimeout); timers = [];
    if (ttsOK) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    stopMouth();
  }

  function setLine(k) {
    for (var i = 0; i < lineEls.length; i++) {
      lineEls[i].classList.toggle("on", i === k);
      dotEls[i].className = i < k ? "done" : i === k ? "now" : "";
    }
    idxNow = -1;
  }
  function wordEls(k) { return lineEls[k].children; }
  function popChip(n) { chips[n].classList.add("on"); }
  function mark(k, j) {
    if (j <= idxNow) return;
    var els = wordEls(k), words = model[k].words;
    for (var a = idxNow + 1; a <= j; a++) {
      if (k === KEY_LINE && KEYS.hasOwnProperty(norm(words[a].t))) popChip(KEYS[norm(words[a].t)]);
    }
    for (var i = 0; i < els.length; i++) {
      els[i].classList.toggle("said", i <= j);
      els[i].classList.toggle("now", i === j);
    }
    idxNow = j;
  }
  function markAll(k) {
    mark(k, model[k].words.length - 1);
    var els = wordEls(k); els[els.length - 1].classList.remove("now");
  }
  function resetWords() {
    for (var i = 0; i < lineEls.length; i++) {
      var els = lineEls[i].children;
      for (var j = 0; j < els.length; j++) els[j].classList.remove("said", "now");
    }
    chips.forEach(function (c) { c.classList.remove("on"); });
    stage.classList.remove("cheer");
  }
  function sparkle(n, spread) {
    if (reduce) return;
    var box = $("sparks"), cols = ["#c9a24a", "#e6cf8f", "#1d2236", "#b9bfd4"];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 80 + Math.random() * spread;
      s.innerHTML = '<svg viewBox="-12 -12 24 24"><path d="M0 -11 L3.2 -3.4 11 -3.4 4.8 1.6 7 9.5 0 5 -7 9.5 -4.8 1.6 -11 -3.4 -3.2 -3.4Z" fill="' + cols[i % 4] + '"/></svg>';
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      s.style.setProperty("--rot", Math.round(Math.random() * 360) + "deg");
      box.appendChild(s);
      setTimeout((function (el) { return function () { el.remove(); }; })(s), 1300);
    }
  }

  function playLine(k, id) {
    var L = model[k];
    setLine(k);
    if (k === SPARK_LINE) sparkle(12, 150);
    startMouth();
    var ctx = { timerDone: false, ttsDone: true, bound: false, adv: false };
    cur = ctx;
    function check() {
      if (ctx.timerDone && ctx.ttsDone && !ctx.adv) {
        ctx.adv = true; stopMouth();
        if (k < model.length - 1) later(function () { playLine(k + 1, id); }, 450, id);
        else later(function () { finish(id); }, 300, id);
      }
    }
    ctx.check = check;
    var t = 250;
    L.words.forEach(function (w, j) {
      later(function () { if (!ctx.bound) mark(k, j); }, t, id);
      t += 150 + 48 * w.t.replace(/\W/g, "").length + (/[,،؛—.]$/.test(w.t) ? 220 : 0);
    });
    later(function () { ctx.timerDone = true; if (!ctx.bound) markAll(k); check(); }, t, id);

    var v = (voiceOn && ttsOK) ? pickVoice() : null;
    if (voiceOn && ttsOK) setVoiceNote(!v);
    if (v) {
      ctx.ttsDone = false;
      var u = new window.SpeechSynthesisUtterance(L.text);
      u.voice = v; u.lang = v.lang;
      u.rate = 0.95; u.pitch = 1.15;
      u.onboundary = function (e) {
        if (id !== run) return;
        if (e.name && e.name !== "word") return;
        ctx.bound = true;
        var idx = 0;
        for (var j = 0; j < L.words.length; j++) if (L.words[j].s <= e.charIndex) idx = j;
        mark(k, idx);
      };
      u.onend = function () { if (id !== run) return; ctx.ttsDone = true; markAll(k); check(); };
      u.onerror = function () { if (id !== run) return; ctx.ttsDone = true; check(); };
      try { window.speechSynthesis.speak(u); } catch (e) { ctx.ttsDone = true; }
      later(function () { ctx.ttsDone = true; check(); }, t + 6000, id);
    }
  }

  function finish() {
    stopMouth(); cur = null;
    for (var i = 0; i < dotEls.length; i++) dotEls[i].className = "done";
    playBtn.textContent = "إعادة";
    cta.hidden = false;
    stage.classList.add("cheer");
    sparkle(16, 190);
  }
  function begin() {
    clearAll(); run++;
    var id = run;
    resetWords();
    cta.hidden = true;
    playBtn.textContent = "من البداية";
    playLine(0, id);
  }

  playBtn.addEventListener("click", begin);
  voiceBtn.addEventListener("click", function () {
    if (!ttsOK) return;
    voiceOn = !voiceOn;
    updateVoiceBtn();
    if (!voiceOn) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
      if (cur) { cur.bound = false; cur.ttsDone = true; cur.check && cur.check(); }
    }
  });
  var watching = false;
  function watchVideos() {
    if (watching) return;
    watching = true;
    if (reduce || !("IntersectionObserver" in window)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var v = e.target;
        if (e.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else v.pause();
      });
    }, { threshold: 0.6 });
    [].slice.call(document.querySelectorAll(".phone video")).forEach(function (v) { io.observe(v); });
  }
  cta.addEventListener("click", function () {
    var w = $("work");
    w.hidden = false;
    w.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    watchVideos();
  });
})();

</script>

</body></html>
